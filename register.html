<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Local Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="registration-card">
        
        <!-- Header -->
        <header class="form-header">
            <h2>Student Registration</h2>
            <p>Please complete the form below to register your academic profile.</p>
        </header>

        <form action="#" method="POST" enctype="multipart/form-data">
            
            <!-- Section 1: Personal Information -->
            <fieldset class="form-section">
                <legend class="section-title">
                    <i class="fa-solid fa-user"></i> Personal Information
                </legend>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-user"></i>
                            <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="guardianName">Father / Guardian Name</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-user-group"></i>
                            <input type="text" id="guardianName" name="guardianName" placeholder="Enter guardian name" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="cnic">CNIC / B-Form Number</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-id-card"></i>
                            <input type="text" id="cnic" name="cnic" placeholder="12345-1234567-1" pattern="^\d{5}-\d{7}-\d{1}$" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-calendar"></i>
                            <input type="date" id="dob" name="dob" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="gender">Gender</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-venus-mars"></i>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="male">Male</option>
                                <option value="female">Female</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                    </div>
                </div>
            </fieldset>

            <!-- Section 2: Contact Information -->
            <fieldset class="form-section">
                <legend class="section-title">
                    <i class="fa-solid fa-address-book"></i> Contact Details
                </legend>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-regular fa-envelope"></i>
                            <input type="email" id="email" name="email" placeholder="student@example.com" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-phone"></i>
                            <input type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX" required>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="address">Residential Address</label>
                        <textarea id="address" name="address" rows="3" placeholder="Enter complete home address" required></textarea>
                    </div>
                </div>
            </fieldset>

            <!-- Section 3: Academic Qualifications -->
            <fieldset class="form-section">
                <legend class="section-title">
                    <i class="fa-solid fa-graduation-cap"></i> Academic Details
                </legend>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label for="marks">Intermediate / FSc Marks (%)</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-percent"></i>
                            <input type="number" id="marks" name="marks" min="0" max="100" step="0.01" placeholder="e.g. 85.5" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="program">Degree Program</label>
                        <div class="input-icon-wrapper">
                            <i class="fa-solid fa-book-open"></i>
                            <select id="program" name="program" required>
                                <option value="" disabled selected>Select Program</option>
                                <option value="bscs">BS Computer Science</option>
                                <option value="bsse">BS Software Engineering</option>
                                <option value="bsit">BS Information Technology</option>
                                <option value="bsai">BS Artificial Intelligence</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group full-width">
                        <label for="document">Upload Academic Document (PDF/JPG)</label>
                        <input type="file" id="document" name="document" accept=".pdf,.jpg,.jpeg,.png" required>
                    </div>
                </div>
            </fieldset>

            <!-- Action Buttons -->
            <footer class="form-actions">
                <button type="reset" class="btn btn-secondary">
                    <i class="fa-solid fa-rotate-left"></i> Reset
                </button>
                <button type="submit" class="btn btn-primary">
                    <i class="fa-solid fa-paper-plane"></i> Submit Application
                </button>
            </footer>

        </form>
    </main>

</body>
</html>
