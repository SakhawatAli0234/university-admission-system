<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <section class="registration-container">

    <div class="form-header">
        <h2>Student Registration</h2>
        <p>Create your account and submit your admission application.</p>
    </div>

    <form id="registrationForm">

        <!-- Personal Information -->
        <div class="form-section">
            <h3>Personal Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        required>
                </div>

                <div class="form-group">
                    <label for="fatherName">Father / Guardian Name</label>
                    <input
                        type="text"
                        id="fatherName"
                        name="fatherName"
                        placeholder="Enter father/guardian name"
                        required>
                </div>

                <div class="form-group">
                    <label for="cnic">CNIC / B-Form Number</label>
                    <input
                        type="text"
                        id="cnic"
                        name="cnic"
                        placeholder="XXXXX-XXXXXXX-X"
                        pattern="[0-9]{5}-[0-9]{7}-[0-9]"
                        required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input
                        type="date"
                        id="dob"
                        name="dob"
                        required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Contact Information -->
        <div class="form-section">
            <h3>Contact Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="03XX-XXXXXXX"
                        required>
                </div>

                <div class="form-group full-width">
                    <label for="address">Complete Address</label>
                    <textarea
                        id="address"
                        name="address"
                        rows="3"
                        placeholder="Enter your complete address"
                        required></textarea>
                </div>

                <div class="form-group">
                    <label for="city">City / District</label>
                    <input
                        type="text"
                        id="city"
                        name="city"
                        placeholder="Enter city or district"
                        required>
                </div>

            </div>
        </div>

        <!-- Academic Information -->
        <div class="form-section">
            <h3>Academic Information</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="qualification">
                        Highest Qualification
                    </label>

                    <select id="qualification" name="qualification" required>
                        <option value="">Select Qualification</option>
                        <option value="matric">Matric</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="fsc">FSc</option>
                        <option value="ics">ICS</option>
                        <option value="fa">FA</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="marks">Intermediate / FSc Marks (%)</label>

                    <input
                        type="number"
                        id="marks"
                        name="marks"
                        min="0"
                        max="100"
                        placeholder="Enter percentage"
                        required>
                </div>

                <div class="form-group">
                    <label for="program">Program Applying For</label>

                    <select id="program" name="program" required>
                        <option value="">Select Program</option>
                        <option value="bscs">
                            BS Computer Science
                        </option>
                        <option value="se">
                            BS Software Engineering
                        </option>
                        <option value="it">
                            BS Information Technology
                        </option>
                        <option value="ai">
                            BS Artificial Intelligence
                        </option>
                    </select>
                </div>

            </div>
        </div>

        <!-- Documents -->
        <div class="form-section">
            <h3>Required Documents</h3>

            <div class="form-grid">

                <div class="form-group">
                    <label for="cnicDocument">
                        CNIC / B-Form
                    </label>

                    <input
                        type="file"
                        id="cnicDocument"
                        name="cnicDocument"
                        accept=".pdf,.jpg,.jpeg,.png"
                        required>
                </div>

                <div class="form-group">
                    <label for="marksheet">
                        Academic Marksheet
                    </label>

                    <input
                        type="file"
                        id="marksheet"
                        name="marksheet"
                        accept=".pdf,.jpg,.jpeg,.png"
                        required>
                </div>

            </div>
        </div>

        <!-- Agreement -->
        <div class="agreement">
            <label>
                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    required>

                I confirm that the information provided is
                accurate and complete.
            </label>
        </div>

        <!-- Buttons -->
        <div class="form-actions">

            <button type="reset" class="btn btn-secondary">
                Reset
            </button>

            <button type="submit" class="btn btn-primary">
                Submit Application
            </button>

        </div>

    </form>

</section>
    
</body>
</html>
