<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <div class="registration-container">

    <div class="header">
        <h1>University Student Registration</h1>
        <p>Create your student account</p>
    </div>

    <form id="registrationForm">

        <h2>Personal Information</h2>

        <label>Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" required>

        <label>Father's / Guardian Name</label>
        <input type="text" id="fatherName" placeholder="Enter father's name" required>

        <label>CNIC / B-Form</label>
        <input type="text" id="cnic" placeholder="XXXXX-XXXXXXX-X" required>

        <label>Date of Birth</label>
        <input type="date" id="dob" required>

        <label>Gender</label>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>


        <h2>Contact Information</h2>

        <label>Email Address</label>
        <input type="email" id="email" placeholder="example@gmail.com" required>

        <label>Phone Number</label>
        <input type="tel" id="phone" placeholder="03XX-XXXXXXX" required>

        <label>Address</label>
        <textarea id="address" placeholder="Enter your complete address" required></textarea>

        <label>City / District</label>
        <input type="text" id="city" placeholder="Enter your city" required>


        <h2>Academic Information</h2>

        <label>Highest Qualification</label>
        <select id="qualification" required>
            <option value="">Select Qualification</option>
            <option>Matric</option>
            <option>Intermediate</option>
            <option>Bachelor</option>
            <option>Other</option>
        </select>

        <label>Marks / Percentage</label>
        <input type="number" id="marks" placeholder="Enter marks or percentage" required>

        <label>Select Program</label>
        <select id="program" required>
            <option value="">Select Program</option>
            <option>BS Computer Science</option>
            <option>BS Software Engineering</option>
            <option>BS Information Technology</option>
            <option>BS Artificial Intelligence</option>
            <option>BS Data Science</option>
        </select>


        <h2>Account Security</h2>

        <label>Password</label>
        <input type="password" id="password" placeholder="Create password" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>


        <div class="terms">
            <input type="checkbox" id="terms" required>
            <label for="terms">
                I confirm that the information provided is correct.
            </label>
        </div>

        <div class="buttons">
            <button type="reset" class="reset-btn">Reset</button>
            <button type="submit" class="submit-btn">Create Account</button>
        </div>

        <div id="successMessage">
            Registration successful! Your application has been submitted.
        </div>

    </form>
</div>


<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f2f5f9;
    }

    .registration-container {
        width: 90%;
        max-width: 850px;
        margin: 40px auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 5px 25px rgba(0,0,0,0.12);
    }

    .header {
        text-align: center;
        margin-bottom: 30px;
    }

    .header h1 {
        margin-bottom: 8px;
        font-size: 30px;
    }

    .header p {
        color: #666;
    }

    h2 {
        margin-top: 30px;
        padding-bottom: 10px;
        border-bottom: 2px solid #ddd;
        font-size: 20px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 7px;
        font-weight: bold;
    }

    input,
    select,
    textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 7px;
        font-size: 15px;
    }

    input:focus,
    select:focus,
    textarea:focus {
        outline: none;
        border-color: #2563eb;
    }

    textarea {
        height: 100px;
        resize: vertical;
    }

    .terms {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 25px;
    }

    .terms input {
        width: auto;
    }

    .terms label {
        margin: 0;
        font-weight: normal;
    }

    .buttons {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }

    button {
        flex: 1;
        padding: 13px;
        border: none;
        border-radius: 7px;
        font-size: 16px;
        cursor: pointer;
    }

    .reset-btn {
        background: #777;
        color: white;
    }

    .submit-btn {
        background: #2563eb;
        color: white;
    }

    .reset-btn:hover {
        background: #555;
    }

    .submit-btn:hover {
        background: #1d4ed8;
    }

    #successMessage {
        display: none;
        margin-top: 20px;
        padding: 15px;
        background: #e7f7ed;
        color: #18733c;
        border-radius: 7px;
        text-align: center;
        font-weight: bold;
    }

    @media (max-width: 600px) {
        .registration-container {
            width: 95%;
            padding: 20px;
        }

        .buttons {
            flex-direction: column;
        }
    }
</style>


<script>
    var form = document.getElementById("registrationForm");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        var password = document.getElementById("password").value;
        var confirmPassword = document.getElementById("confirmPassword").value;

        if (password.length < 8) {
            alert("Password must contain at least 8 characters.");
            return;
        }

        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }

        document.getElementById("successMessage").style.display = "block";

        window.scrollTo({
            top: document.body.scrollHeight,
            behavior: "smooth"
        });
    });
</script>
</body>
</html>
